name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.7.14

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Put the language beside the checkout
        run: git clone --depth 1 --branch dev https://github.com/d-fiber/scribe_alchemy.git "$GITHUB_WORKSPACE/../scribe_alchemy"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Format, lint, type check, run the suite and the example
        run: bash tool/test.sh

  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check licence headers
        run: bash .github/headers/check.sh

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/commits/check.sh "$BASE" "$HEAD"

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and what the changelog says about it
        run: bash .github/version/check.sh

  release:
    needs: [verify, headers, commits, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write what this version is made of, if it has moved
        run: |
          set -eu
          bash .github/version/changelog.sh

          git diff --quiet CHANGELOG.md && exit 0

          version=$(awk -F'"' '/"version"/ { print $4; exit }' deno.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[DOC]: write what $version is made of"
          git push origin HEAD:dev

      - name: Name this commit after the version, if it has moved
        run: bash .github/version/tag.sh
