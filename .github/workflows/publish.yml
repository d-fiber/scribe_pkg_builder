name: publish

on:
  workflow_call:
    inputs:
      version:
        description: The version being published, as three numbers.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  DENO_VERSION: 2.7.14

jobs:
  jsr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Check that main holds the version being published
        env:
          ASKED: ${{ inputs.version }}
        run: |
          set -eu
          held=$(awk -F'"' '/"version"/ { print $4; exit }' deno.json)
          [ "$held" = "$ASKED" ] || {
            echo "main holds $held and the release is $ASKED" >&2
            exit 1
          }
          echo "main holds $held"

      - name: Publish to JSR
        run: deno publish
